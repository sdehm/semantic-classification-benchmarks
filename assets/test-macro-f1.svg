<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title description">
  <title id="title">Test macro F1 by dataset</title>
  <desc id="description">BANKING77: Jev 0.8445, earlier local model 0.8981, sequence head 0.9234. GoEmotions: Jev 0.3437, earlier local model 0.5411, sequence head 0.5443. English MultiEURLEX level 1: Jev 0.4671, earlier local model 0.6013, sequence head 0.6104. Jev and the earlier local model are from the original frozen comparison; sequence-head results are later exploratory runs. Compare models within each dataset only; MultiEURLEX uses different input context policies.</desc>
  <rect width="900" height="420" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111827">
    <text x="24" y="35" font-size="22" font-weight="bold">Test macro F1 by dataset</text>
    <rect x="240" y="62" width="16" height="16" fill="#1d4ed8"/>
    <text x="264" y="75" font-size="15">Jev</text>
    <rect x="330" y="62" width="16" height="16" fill="#b45309"/>
    <text x="354" y="75" font-size="15">Earlier local model</text>
    <rect x="530" y="62" width="16" height="16" fill="#047857"/>
    <text x="554" y="75" font-size="15">Sequence head (exploratory)</text>
    <g stroke="#d1d5db" stroke-width="1">
      <line x1="240" y1="94" x2="240" y2="340"/>
      <line x1="365" y1="94" x2="365" y2="340"/>
      <line x1="490" y1="94" x2="490" y2="340"/>
      <line x1="615" y1="94" x2="615" y2="340"/>
      <line x1="740" y1="94" x2="740" y2="340"/>
    </g>
    <g font-size="15">
      <text x="24" y="142">BANKING77</text>
      <text x="24" y="222">GoEmotions</text>
      <text x="24" y="302">MultiEURLEX</text>
    </g>
    <g fill="#1d4ed8">
      <rect x="240" y="110" width="422.25" height="18"/>
      <rect x="240" y="190" width="171.85" height="18"/>
      <rect x="240" y="270" width="233.55" height="18"/>
    </g>
    <g fill="#b45309">
      <rect x="240" y="133" width="449.05" height="18"/>
      <rect x="240" y="213" width="270.55" height="18"/>
      <rect x="240" y="293" width="300.65" height="18"/>
    </g>
    <g fill="#047857">
      <rect x="240" y="156" width="461.7" height="18"/>
      <rect x="240" y="236" width="272.15" height="18"/>
      <rect x="240" y="316" width="305.2" height="18"/>
    </g>
    <g font-size="14">
      <text x="670" y="124">0.8445</text>
      <text x="697" y="147">0.8981</text>
      <text x="710" y="170">0.9234</text>
      <text x="420" y="204">0.3437</text>
      <text x="519" y="227">0.5411</text>
      <text x="521" y="250">0.5443</text>
      <text x="482" y="284">0.4671</text>
      <text x="549" y="307">0.6013</text>
      <text x="554" y="330">0.6104</text>
    </g>
    <g font-size="13" text-anchor="middle">
      <text x="240" y="351">0.00</text>
      <text x="365" y="351">0.25</text>
      <text x="490" y="351">0.50</text>
      <text x="615" y="351">0.75</text>
      <text x="740" y="351">1.00</text>
    </g>
    <text x="24" y="379" font-size="13">Jev and earlier local: original frozen runs. Sequence head: later exploratory run.</text>
    <text x="24" y="400" font-size="13">MultiEURLEX uses unequal context: local reads 256 tokens; Jev reads up to 100,000 characters.</text>
  </g>
</svg>
