[project]
name = "jev-classify-test"
version = "0.1.0"
description = "Reproducible local and hosted text-classification benchmarks."
requires-python = ">=3.11,<3.15"
dependencies = [
  "accelerate>=1.1.0",
  "datasets>=5.0.1",
  "numpy>=2.2",
  "polars>=1.22",
  "scikit-learn>=1.6",
  "sentence-transformers>=6.1.0",
  "torch>=2.7",
  "transformers>=4.48,<6",
]

[tool.uv]
package = false
